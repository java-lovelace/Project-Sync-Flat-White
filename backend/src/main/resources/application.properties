# Database Configuration

# Import local properties for sensitive credentials
spring.config.import=classpath:application-local.properties

# JDBC URL for PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Database username and password
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: initialize schema on startup (can help during development)
spring.sql.init.mode=always